<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Toolkit for Liquid Budget</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" />
  <style>
    /* Liquid Budget's look. Defaults are its light theme; popup.js swaps in
       whatever theme the app last showed (saved by the content script). */
    :root {
      --background: 36 30% 96%;
      --foreground: 28 25% 12%;
      --card: 36 34% 93%;
      --muted: 36 24% 90%;
      --muted-foreground: 30 14% 40%;
      --border: 34 22% 84%;
      --primary: 26 92% 36%;
      --primary-foreground: 0 0% 100%;
      --success: 220 60% 42%;
      --warning: 34 95% 35%;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 400px;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: "Barlow Semi Condensed", "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.35;
    }
    header { display: flex; align-items: center; gap: 10px; padding: 9px 16px 8px; border-bottom: 1px solid hsl(var(--border)); }
    header img { width: 26px; height: 26px; border-radius: 6px; }
    header h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
    header .ver { font-size: 12px; color: hsl(var(--muted-foreground)); }
    /* Chrome caps popups at 600px tall: header and footer stay put, the list scrolls if needed. */
    body { display: flex; flex-direction: column; max-height: 600px; }
    header, hr, footer { flex: none; }
    main { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 12px 2px; }
    .section { margin: 7px 0 3px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: hsl(var(--muted-foreground)); }
    .card { border: 1px solid hsl(var(--border)); border-radius: 10px; background: hsl(var(--card)); overflow: hidden; box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
    .row { display: flex; align-items: center; gap: 12px; padding: 5px 12px; cursor: pointer; }
    .row + .row { border-top: 1px solid hsl(var(--border)); }
    .row:hover { background: hsl(var(--muted) / .6); }
    .text { flex: 1; min-width: 0; }
    .title { font-weight: 600; font-size: 13.5px; }
    .desc { margin-top: 0; font-size: 11.5px; line-height: 1.25; color: hsl(var(--muted-foreground)); }
    .tag { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 999px; font-size: 10.5px; font-weight: 600; vertical-align: 1px; background: hsl(var(--muted)); color: hsl(var(--muted-foreground)); }

    /* Switch */
    .switch { position: relative; flex: none; width: 34px; height: 20px; }
    .switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: hsl(var(--border)); transition: background .15s; pointer-events: none; }
    .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .15s; }
    .switch input:checked + span { background: hsl(var(--primary)); }
    .switch input:checked + span::after { transform: translateX(14px); }
    .switch input:focus-visible + span { outline: 2px solid hsl(var(--primary)); outline-offset: 2px; }

    hr { margin: 9px 0 0; border: 0; border-top: 1px solid hsl(var(--border)); }
    footer { padding: 8px 16px 9px; }
    .api { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--warning)); }
    .dot.ok { background: hsl(var(--success)); }
    .api .muted { color: hsl(var(--muted-foreground)); }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px;
      border: 1px solid hsl(var(--border)); border-radius: 6px; background: hsl(var(--background));
      color: hsl(var(--foreground)); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn:hover { background: hsl(var(--muted)); }
    .btn.primary { background: hsl(var(--primary)); border-color: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
    #status { font-size: 12px; font-weight: 600; color: hsl(var(--success)); }
    .fine { margin-top: 6px; font-size: 11px; color: hsl(var(--muted-foreground)); }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" />
    <div>
      <h1>Toolkit for Liquid Budget</h1>
      <div class="ver"><span id="ver"></span> · Unofficial</div>
    </div>
  </header>

  <main>
    <div class="section">Budget</div>
    <div class="card">
      <label class="row">
        <div class="text">
          <div class="title">Pacing page <span class="tag">API</span></div>
          <div class="desc">Pace vs. usual, buckets running out, quick assign tips.</div>
        </div>
        <span class="switch"><input type="checkbox" data-setting="forecastMenu" /><span></span></span>
      </label>
      <label class="row">
        <div class="text">
          <div class="title">Days of Buffer <span class="tag">API</span></div>
          <div class="desc">Days your Liquid accounts last at recent spending.</div>
        </div>
        <span class="switch"><input type="checkbox" data-setting="bufferWidget" /><span></span></span>
      </label>
      <label class="row">
        <div class="text">
          <div class="title">Retirement Horizon</div>
          <div class="desc">Progress to financial independence, 4% rule.</div>
        </div>
        <span class="switch"><input type="checkbox" data-setting="retireWidget" /><span></span></span>
      </label>
      <label class="row">
        <div class="text">
          <div class="title">Future assigned months</div>
          <div class="desc">Money assigned in coming months, and % funded.</div>
        </div>
        <span class="switch"><input type="checkbox" data-setting="futureAssigned" /><span></span></span>
      </label>
      <label class="row">
        <div class="text">
          <div class="title">Reports: include all transactions</div>
          <div class="desc">Adds this month's scheduled and pending to Inflow / Outflow.</div>
        </div>
        <span class="switch"><input type="checkbox" data-setting="reportsIncludeAll" /><span></span></span>
      </label>
      <label class="row">
        <div class="text">
          <div class="title">Reports: Cash Flow tab</div>
          <div class="desc">A Sankey chart of the month: income → budget → categories.</div>
        </div>
        <span class="switch"><input type="checkbox" data-setting="cashFlowTab" /><span></span></span>
      </label>
      <label class="row">
        <div class="text">
          <div class="title">Available includes upcoming <span class="tag">API</span></div>
          <div class="desc">Takes later-this-month transactions out of Available.</div>
        </div>
        <span class="switch"><input type="checkbox" data-setting="availIncludesUpcoming" /><span></span></span>
      </label>
    </div>

    <div class="section">Display</div>
    <div class="card">
      <label class="row">
        <div class="text">
          <div class="title">Compact left menu</div>
          <div class="desc">Tighter rows from Budget to Recurring Transactions.</div>
        </div>
        <span class="switch"><input type="checkbox" data-setting="compactMenu" /><span></span></span>
      </label>
      <label class="row">
        <div class="text">
          <div class="title">Highlight budget errors</div>
          <div class="desc">Makes warnings like Budget Overdraft stand out.</div>
        </div>
        <span class="switch"><input type="checkbox" data-setting="highlightErrors" /><span></span></span>
      </label>
      <label class="row">
        <div class="text">
          <div class="title">Hide Net Worth</div>
          <div class="desc">Hides the Net Worth card in the sidebar.</div>
        </div>
        <span class="switch"><input type="checkbox" data-setting="hideNetWorth" /><span></span></span>
      </label>
      <label class="row">
        <div class="text">
          <div class="title">Hide currency symbol</div>
          <div class="desc">Shows amounts without the currency symbol.</div>
        </div>
        <span class="switch"><input type="checkbox" data-setting="hideCurrency" /><span></span></span>
      </label>
      <label class="row">
        <div class="text">
          <div class="title">Thicker month dividers</div>
          <div class="desc">A bolder line between months in transaction lists.</div>
        </div>
        <span class="switch"><input type="checkbox" data-setting="thickMonthDividers" /><span></span></span>
      </label>
    </div>
  </main>

  <hr />
  <footer>
    <div class="actions">
      <div class="api">
        <span class="dot" id="apiDot"></span>
        <span id="apiText">Checking API token…</span>
      </div>
      <button id="openSettings" class="btn">Settings &amp; API token</button>
    </div>
    <div class="fine">API features use a read-only token. Unofficial; not part of Liquid Budget. <span id="status"></span></div>
  </footer>
  <script src="options.js"></script>
</body>
</html>
